# AutoFilm 业务配置示例（复制为 config.yaml 使用）
#
# 本文件只包含「业务数据」：AList 客户端、媒体服务器、同步 / 追番 / 海报任务。
# Web 管理面板自身设置（监听地址、认证、文件监听）已拆分到 web.example.yaml，
# 两份配置各自独立保存、互不覆盖。
#
# 整份配置允许为空：所有分区都可以省略，程序会按空配置启动。

alist:                                      # AList 服务器列表（兼容 OpenList），支持多个服务器配置；每个服务器配置一个独立的 ID，供后续任务引用
  - id: 我的Alist                            # 标识 ID，用于关联 AList 客户端对象
    base_url: http://alist:5244             # AList 服务器地址；需带 http:// 或 https:// 前缀
    public_url: https://alist.example.com   # 公共访问地址，用于生成 .strm 内容（可选）
    username: admin                         # AList 用户名（使用 token 时可留空）
    password: adminadmin                    # AList 密码（使用 token 时可留空）
    otp_code:                               # AList 两步验证验证码（可选）
    token:                                  # AList 永久令牌（可选；填写后无需 username/password）
    wait_time: 0                            # AList API 请求最小间隔时间，单位秒；0 表示不限速

  - id: OpenList                            # 标识 ID，用于关联 AList 客户端对象
    base_url: http://openlist.com:443       # 兼容 OpenList
    public_url: 
    username: admin
    password: adminadmin
    otp_code:
    token:
    wait_time: 0

  - id: 使用Token认证的Alist
    base_url: http://alist.com:5244
    public_url:
    username:
    password:
    otp_code:
    token: alist-your-static-token
    wait_time: 0.2

media_servers:
  - id: 我的Jellyfin                     # 标识 ID，用于 LibraryPoster 任务引用
    kind: jellyfin                      # 服务器类型：jellyfin 或 emby
    base_url: http://jellyfin:8096      # 媒体服务器地址
    api_key: your-api-key               # Jellyfin/Emby API Key；Jellyfin 请勿含空格、引号等特殊字符
    user_id:                            # 查询媒体项使用的用户 ID；留空时自动使用首个用户
    timeout: 30                         # HTTP 请求超时时间，单位秒


alist2strm:                                # Alist2Strm 全局设置：所有同步任务共用一份，任务里不再单独配置
  strm_ext: [.mp4, .mkv, .flv, .avi, .wmv, .ts, .rmvb, .webm, .mpg, .m2ts]
                                           # 需要生成 .strm 的源文件后缀白名单（可省略，省略即使用这组默认视频后缀）
                                           # 大小写不敏感、可带或不带 `.` 前缀，重复项自动去重；只对匹配的文件生成 .strm
                                           # .iso 会输出为 xxx.iso.strm，其它后缀输出为 xxx.strm
                                           # 同目录的字幕/图片/NFO 会同步改为 xxx.iso.zh-cn.srt 这类名字，媒体服务器才认领得到
  concurrency: 50                          # 同时处理的文件数量上限，可以减轻运行设备与 AList 服务器负载
  download:                                # 伴生文件下载（字幕、图片、NFO、自定义后缀）
    enable: false                          # 是否下载伴生文件；平铺模式下始终不下载
    subtitle: false                        # 是否下载字幕：.ass、.srt、.ssa、.sub
    image: false                           # 是否下载图片：.png、.jpg
    nfo: false                             # 是否下载 .nfo
    other_ext: []                          # 自定义下载后缀列表，例如 [".zip", ".md"]
    concurrency: 5                         # 同时下载伴生文件的数量上限
  sync:                                    # 同步删除（远端已不存在的本地文件）
    enabled: true                          # 是否开启；扫描失败的目录会自动排除在删除范围外
    ignore: "\\.(nfo|jpg)$"                # 删除时忽略的文件名正则；仅匹配文件名，不匹配完整路径
    smart_protection:                      # 智能删除保护，仅在 sync.enabled 为 true 时生效
      enabled: true                        # 是否启用保护
      threshold: 100                       # 触发保护的待删除文件数量阈值
      grace_scans: 3                       # 达到阈值后连续确认多少次才真正删除

alist2strm_tasks:
  - id: 动漫                                 # 标识 ID，用于日志和 .strm 智能保护状态文件
    cron: 0 0 20 * * *                      # 后台定时任务 Cron 表达式；格式为`<秒> <分> <时> <日> <月> <星期>`
    alist: 我的Alist                         # 关联上面定义的 AList 客户端 ID（可以多个任务关联同一个 AList 客户端实现复用）
    source_dir: /ani                        # AList 服务器上需要扫描的目录
    target_dir: /media/ani                  # 本地 .strm 和伴生文件输出目录
    flatten_mode: false                     # 平铺模式；开启后所有 .strm 输出到同一级目录，且不会下载伴生文件
    overwrite: false                        # 覆盖模式；本地已存在同名文件时是否重新生成/下载
    dir_time_check: false                   # 目录时间检查；仅当远端目录修改时间晚于本地目录时才扫描其子目录。
                                            # 文件已更新却仍被跳过时，请关闭本项（部分网盘驱动的目录时间不随内容更新）

  - id: 电影
    cron: 0 0 20 * * *
    alist: 使用Token认证的Alist
    source_dir: /movies
    target_dir: /media/movies
    flatten_mode: false
    overwrite: false

ani2alist_tasks:
  - id: 新番追更                                      # 标识 ID，用于日志和调度识别
    cron: 0 20 12 * * *                              # 后台定时任务 Cron 表达式
    alist: OpenList                                  # 关联上面定义的 AList 客户端 ID（需要管理员权限）
    target_dir: /Anime                               # UrlTree 存储器挂载路径，不存在时会自动创建
    source:                                          # 数据源配置
      source_url: https://aniopen.an-i.workers.dev   # ANI Open 目录数据源完整 URL
      rss_url: https://api.ani.rip/ani-download.xml  # ANI RSS 完整 URL
    update:                                          # 更新模式（有 rss、latest、keyword 3 种模式）
      mode: rss                                      # RSS 追更模式，读取 rss_url 中的最新条目

  - id: 最新季度
    cron: 0 10 7 * * *
    alist: OpenList
    target_dir: /Anime
    source:
      source_url: https://aniopen.an-i.workers.dev
      rss_url: https://api.ani.rip/ani-download.xml
    update:
      mode: latest                                   # 当前季度模式，运行时自动计算 source_url/{year}-{month}/
      template: "{{ year }}年/{{ month }}月"          # 写入 UrlTree 的子目录模板；留空则直接写入 target_dir

  - id: 自定义关键字
    cron: 0 30 7 * * *
    alist: 我的Alist
    target_dir: /Anime
    source:
      source_url: https://aniopen.an-i.workers.dev
      rss_url: https://api.ani.rip/ani-download.xml
    update:
      mode: keyword                                   # 关键字模式，递归解析 source_url/{keyword}/
      keyword: "2026-4"

library_poster_tasks:
  - id: 媒体库海报
    cron: 0 50 13 * * *                     # 后台定时任务 Cron 表达式
    server: 我的Jellyfin                     # 关联 media_servers 中定义的服务器 ID
    upload: false                           # 是否覆盖服务器上的媒体库 Primary 图片
    output_dir: /media/posters              # 本地预览输出目录；与 upload 至少启用一个
    title_font: /fonts/ch.ttf               # 主标题字体路径
    subtitle_font: /fonts/en.otf            # 副标题字体路径
    render:
      style: collage                        # 风格可选：card、split、collage、blur
      resolution: 1080p                     # 预设分辨率：480p、720p、1080p；或者是自定义分辨率：{width: 1600, height: 900}
      blur_radius: 50                       # 模糊半径，以 1080p 为基准自动缩放
      color_strength: 0.8                   # 主题色叠加强度，范围 0.0～1.0
    libraries:                              # 只处理这里明确列出的媒体库
      - name: 动漫                           # Jellyfin/Emby 中的媒体库名称
        title: 动漫                          # 海报主标题；留空时使用媒体库名称
        subtitle: ANIME                     # 海报副标题
        sort: date_last_content_added       # 可选排序方式：random、date_created、date_last_content_added
      - name: 电影
        title: 电影
        subtitle: MOVIE
        sort: random

# MediaWarp 反向代理（前置于 Emby / Jellyfin，让 HTTPStrm 走 302 直链播放）
# 这一段是面板「MediaWarp」页的数据源，保存在 config.yaml；保存后面板会生成
# 同目录的 mediawarp.yaml 并自动重启代理服务（容器内为 /config/mediawarp.yaml）。
# 省略整段时使用内置默认值且 enable=false。
mediawarp:
  enable: true                              # 由 AutoFilm 托管子进程；关闭时只生成配置文件、不自动重启
  config_path: mediawarp.yaml               # 相对 config.yaml 所在目录；也可填绝对路径
  binary: mediawarp                        # 可执行文件，只写名字时按 PATH 查找（容器内 /usr/local/bin/mediawarp）
  extra_args: []                           # 追加在 --config 之后的启动参数，如 ["--debug"]
  startup_timeout_secs: 10                 # 重启后等待端口就绪的秒数
  stop_timeout_secs: 5                     # 旧进程优雅退出的等待秒数

  port: 9000                               # MediaWarp 监听端口（需在 compose 中映射出来）
  server:
    type: Emby                            # Emby / Jellyfin（区分大小写）
    addr: http://emby:8096                # 上游媒体服务器地址
    auth: your-emby-api-key               # 控制台 -> 高级 -> API 密钥
  log:
    access:
      console: true
      file: false
    service:
      console: true
      file: true
  cache:
    enable: true
    http_strm_ttl: 1m                     # Go 时长格式：0 / 300ms / 1m / 2h45m；0 表示关闭
    image_ttl: 10m
    subtitle_ttl: 2h
  client:
    enable: false                        # 按 User-Agent 关键字过滤客户端
    mode: BlackList                      # WhiteList / BlackList
    list:
      - Fileball
      - Infuse
  http_strm:
    enable: true
    proxy: false                         # true 时允许串流 / 转码流量经过媒体服务器
    final_url: true                      # 重定向前解析最终地址
    allow_loopback: false                # SSRF 防护；同机 Alist 直连才设为 true
    compatibility_mode: false
    hide_embedded_subtitles: false       # 对命中的 Strm 隐藏内嵌字幕流
    hide_embedded_subtitles_clients: []  # 留空对所有客户端生效，如 ["Mozilla"]
    prefix_list:                         # 媒体服务器内 Strm 文件的路径前缀
      - /media/strm/http
      - /media/strm/https
