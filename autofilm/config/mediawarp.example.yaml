# MediaWarp 生成文件示例（仅作参考，不是配置文件本身）
#
# AutoFilm 会把面板「MediaWarp」页的配置渲染成 config/mediawarp.yaml
# （容器内 /config/mediawarp.yaml），并用 `--config <该文件>` 启动子进程。
# 本文件不会被程序读取；实际生成内容以面板为准，请勿手工编辑生成文件。
#
# 字段说明与上游一致：https://github.com/zian-yan/MediaWarp/blob/main/config/config.yaml.example
port: 9000
server:
  type: Emby                          # Emby / Jellyfin（区分大小写）
  addr: http://emby:8096              # 上游媒体服务器地址
  auth: your-emby-api-key             # Emby/Jellyfin 控制台 -> 高级 -> API 密钥
log:
  access:
    console: true
    file: false
  service:
    console: true
    file: true
cache:
  enable: true
  http_strm_ttl: 1m                   # Go 时长格式：0 / 300ms / 1m / 2h45m
  image_ttl: 10m
  subtitle_ttl: 2h
client:
  enable: false
  mode: BlackList                     # WhiteList / BlackList
  list:
    - Fileball
    - Infuse
http_strm:
  enable: true
  proxy: false
  final_url: true
  allow_loopback: false               # SSRF 防护；同机 Alist 直连才设为 true
  compatibility_mode: false
  hide_embedded_subtitles: false
  hide_embedded_subtitles_clients: []
  prefix_list:
    - /media/strm/http
    - /media/strm/https
