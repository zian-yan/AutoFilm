# AutoFilm Web 管理面板配置示例（复制为 web.yaml 使用）
#
# 本文件与业务配置 config.yaml 完全独立：这里只放面板自身的监听地址与认证，
# 面板保存业务配置时不会重写本文件，反之亦然。
#
# 整份配置允许为空：缺省值等价于下面这份内容（不启用面板、仅本机监听）。

enable: false                               # 是否启用面板；启用后可在浏览器里增删改业务配置并热重载
listen: 127.0.0.1:8080                     # 监听地址，必须是 ip:port；监听非回环地址时必须设置密码，否则进程拒绝启动
username: admin                            # HTTP Basic 认证用户名（设置密码时必填）
password: ""                               # HTTP Basic 认证密码；留空表示不认证，此时只允许监听回环地址
watch_file: true                           # 监听配置文件的外部改动并自动重载（2 秒轮询，同时监听 config.yaml 与 web.yaml）
