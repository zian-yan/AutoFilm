<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0e1114" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
  <title>AutoFilm 控制台</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand brand">
        <span class="brand-mark" aria-hidden="true">AF</span>
        <span class="brand-text">
          <strong>AutoFilm</strong>
          <small>管理控制台</small>
        </span>
      </div>
      <nav id="nav" class="nav" aria-label="配置分区"></nav>
      <div class="sidebar-foot">
        <span id="app-version" class="version">-</span>
        <div class="sidebar-tools">
          <button id="btn-logout" class="btn btn-icon is-hidden" type="button" aria-label="退出登录"></button>
          <button id="btn-theme" class="btn btn-icon" type="button" aria-label="切换主题"></button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="page-head">
        <div>
          <h1 id="section-title">配置</h1>
          <p id="section-subtitle" class="muted"></p>
        </div>
        <div class="page-actions">
          <span id="save-status" class="save-status save-status-saved" role="status">全部更改已实时生效</span>
        </div>
      </div>

      <div id="alert" class="alert is-hidden" role="alert"></div>
      <div id="content" class="content"></div>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <script src="/assets/app.js"></script>
</body>
</html>
