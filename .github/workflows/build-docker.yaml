name: Build Docker

on:
  workflow_call:
    inputs:
      push:
        description: "Whether to push the Docker image"
        required: true
        type: boolean
    secrets:
      # 允许为空：fork 或未配置 Docker Hub 凭据时自动跳过 Docker Hub，
      # 只推送到 GHCR（使用内置 GITHUB_TOKEN），避免整条发布流水线中断。
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  build-docker:
    runs-on: ubuntu-latest
    name: Build Docker Image
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve image registries
        id: registry
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          images="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            images="${DOCKERHUB_USERNAME}/autofilm"$'\n'"${images}"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未配置 DOCKERHUB_USERNAME，本次仅推送 GHCR 镜像"
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "images<<IMAGES_EOF"
            printf '%s\n' "${images}"
            echo "IMAGES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # 同时生成 Docker Hub 和 GHCR 的镜像标签，两边标签规则完全保持一致
          images: ${{ steps.registry.outputs.images }}
          # 保留分支、语义化版本和原始 v* tag，确保 Release 中的镜像 tag 可直接拉取
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Download Linux binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-unknown-linux-musl"
          path: targets

      - name: Prepare Docker build binaries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p targets/linux/amd64 targets/linux/arm64

          cp targets/x86_64-unknown-linux-musl/autofilm targets/linux/amd64/autofilm
          cp targets/aarch64-unknown-linux-musl/autofilm targets/linux/arm64/autofilm

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: steps.registry.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.ci
          platforms: |
            linux/amd64
            linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Docker Hub Description
        if: ${{ inputs.push && steps.registry.outputs.dockerhub == 'true' }}
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/autofilm
          short-description: ${{ github.event.repository.description }}
