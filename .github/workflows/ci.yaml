name: Continuous Integration

on:
  push:
    paths:
      - "autofilm/**/*.rs"
      - "autofilm/Cargo.toml"
      - "autofilm/Cargo.lock"
      - "autofilm/rust-toolchain.toml"
      - "autofilm/rustfmt.toml"
      - "mediawarp/**/*.go"
      - "mediawarp/go.mod"
      - "mediawarp/go.sum"
      # mediawarp/ 改为 submodule 后，指针更新在 diff 里表现为单个路径 `mediawarp`
      - "mediawarp"
      - ".gitmodules"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit Testing (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
          - windows-11-arm

    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      # rust-toolchain.toml 是编译器版本的唯一来源：直接装它，免得先装 stable 再被 rustup 换掉
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' autofilm/rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            autofilm -> autofilm/target
            autofilm/alist-client-rs -> autofilm/alist-client-rs/target

      - name: Test AutoFilm
        working-directory: autofilm
        run: cargo test --locked

      - name: Test Alist Client
        working-directory: autofilm
        run: cargo test --locked --manifest-path alist-client-rs/Cargo.toml

  fmt-check:
    name: Rust Code Linting
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Rust Format Check
        working-directory: autofilm
        run: cargo +nightly fmt --check
