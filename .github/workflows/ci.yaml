name: Continuous Integration

# 只在发布新版本（推 `v*.*.*` tag）时跑，日常推送到分支不再触发。
# 5 个平台的完整单测 + lint 成本不低，而真正需要这道闸门的是「要发出去的包」；
# 日常改动本地跑 `cargo +nightly fmt --check` 与 `cargo test --locked --lib` 即可。
# 临时需要全平台验证时，在 Actions 页面手动 Run workflow。
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit Testing (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
          - windows-11-arm

    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      # rust-toolchain.toml 是编译器版本的唯一来源：直接装它，免得先装 stable 再被 rustup 换掉
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' autofilm/rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            autofilm -> autofilm/target
            autofilm/alist-client-rs -> autofilm/alist-client-rs/target

      - name: Test AutoFilm
        working-directory: autofilm
        run: cargo test --locked

      - name: Test Alist Client
        working-directory: autofilm
        run: cargo test --locked --manifest-path alist-client-rs/Cargo.toml

  fmt-check:
    name: Rust Code Linting
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Rust Format Check
        working-directory: autofilm
        run: cargo +nightly fmt --check
